backend:
  name: turbo-github
  turbo_site_id: 7429eae4-7336-4421-91e4-1ba9a4d00b6b
  branch: main

locale: zh_Hans
media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 日志
    label_singular: 日志
    folder: content/posts
    create: true
    extension: md
    format: toml-frontmatter
    slug: '{{slug}}'
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发表时间, name: date, widget: datetime, default: '{{now}}' }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - { label: 正文, name: body, widget: markdown }
